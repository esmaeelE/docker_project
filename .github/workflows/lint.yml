name: Lint

on:
  push:
    paths:
      - "**/Dockerfile"
  pull_request:
    paths:
      - "**/Dockerfile"

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3018,DL3013
